plugins {
    id 'com.android.application'
}

def ksPass = System.getenv('KEYSTORE_PASSWORD')

android {
    namespace 'com.z1fire.hardhathero'
    compileSdk 34

    defaultConfig {
        applicationId 'com.z1fire.hardhathero'
        minSdk 21
        targetSdk 34
        versionCode((System.getenv('VERSION_CODE') ?: '1') as int)
        versionName System.getenv('VERSION_NAME') ?: '1.0.0'
    }

    signingConfigs {
        release {
            if (ksPass) {
                storeFile file(System.getenv('KEYSTORE_PATH'))
                storePassword ksPass
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig ksPass ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
